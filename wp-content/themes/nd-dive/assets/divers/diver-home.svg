<style>
@keyframes wave{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(6deg)}}
@keyframes pulse{0%,100%{opacity:.45;transform:scale(.95)}50%{opacity:1;transform:scale(1.06)}}
@keyframes bubble{0%,100%{transform:translateY(0) scale(.95);opacity:.65}50%{transform:translateY(-7px) scale(1.1);opacity:1}}
.wave{transform-origin:212px 204px;animation:wave 2.6s ease-in-out infinite}
.arc{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-in-out infinite}
.b1{animation:bubble 3.6s ease-in-out infinite}
.b2{animation:bubble 3.6s ease-in-out -1.2s infinite}
.b3{animation:bubble 3.6s ease-in-out -2.4s infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
