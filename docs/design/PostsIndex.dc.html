.nd-row:hover{background:rgba(111,235,215,0.06)}

<div role="group" aria-label="Filter posts" style="display: flex; flex-wrap: wrap; gap: 10px; padding: 8px 0 28px">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
<sc-if value="{{f.selected}}" hint-placeholder-val="{{false}}">
<button type="button" class="nd-chip" aria-pressed="true" onClick="{{f.pick}}" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #6FEBD7; background: #6FEBD7; color: #04222E; font-size: 15px; font-weight: 600">{{f.label}}</button>
</sc-if>
<sc-if value="{{f.unselected}}" hint-placeholder-val="{{true}}">
<button type="button" class="nd-chip" aria-pressed="false" onClick="{{f.pick}}" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid rgba(111, 235, 215, 0.35); background: transparent; color: #E6F6F7; font-size: 15px; font-weight: 500">{{f.label}}</button>
</sc-if>
</sc-for>
</div>

<sc-if value="{{showFeatured}}" hint-placeholder-val="{{true}}">
<a href="{{featured.href}}" style="display: flex; flex-wrap: wrap; border-radius: 20px; overflow: hidden; background: rgba(4, 34, 46, 0.72); border: 1px solid rgba(111, 235, 215, 0.25); color: #E6F6F7; text-decoration: none; margin-bottom: 32px">
<div style="flex: 1 1 420px; min-height: 260px; background: rgba(15, 82, 102, 0.45); display: flex; align-items: center; justify-content: center; color: #B4D9DD; font-size: 14px">[Cover image]</div>
<div style="flex: 1 1 380px; padding: 32px; display: flex; flex-direction: column; gap: 12px; justify-content: center">
<p style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #6FEBD7">latest · {{featured.type}}</p>
<h2 style="margin: 0; font-size: 32px; font-weight: 700; line-height: 1.15; letter-spacing: -0.02em">{{featured.title}}</h2>
<p style="margin: 0; color: #B4D9DD">{{featured.excerpt}}</p>
<p style="margin: 4px 0 0; font-size: 14px; color: #9CC3C8">{{featured.date}} · {{featured.read}}</p>
</div>
</a>
</sc-if>

<ol style="list-style: none; margin: 0; padding: 0 0 96px; border-top: 1px solid rgba(111, 235, 215, 0.2)">
<sc-for list="{{rest}}" as="p" hint-placeholder-count="5">
<li style="border-bottom: 1px solid rgba(111, 235, 215, 0.2)">
<a href="{{p.href}}" class="nd-row" style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 32px; padding: 24px 12px; color: #E6F6F7; text-decoration: none; border-radius: 10px">
<span style="flex: 0 0 140px; font-size: 14px; color: #9CC3C8">{{p.date}}</span>
<span style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 20px; font-weight: 600">{{p.title}}</span>
<span style="color: #B4D9DD; font-size: 15px">{{p.excerpt}}</span>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":2200}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { filter: 'All' }; }
  renderVals() {
    const posts = [
      { title: 'Bollard 0.1.2 is out', type: 'Release', date: '[DATE]', read: '2 min read', href: 'PostRelease.dc.html', excerpt: '[One-line summary of what changed.]' },
      { title: 'Building the UAB alumni site', type: 'Project update', date: '[DATE]', read: '6 min read', href: 'PostCaseStudy.dc.html', excerpt: 'How a from-scratch WordPress theme lets university staff publish without a developer.' },
      { title: 'What building for public agencies taught me', type: 'Notes', date: '[DATE]', read: '5 min read', href: 'PostArticle.dc.html', excerpt: '[One-line excerpt.]' },
      { title: 'Config in code, not in the database', type: 'Notes', date: '[DATE]', read: '4 min read', href: 'PostArticle.dc.html', excerpt: '[One-line excerpt.]' },
      { title: 'Starting Buck-et List Brands', type: 'Project update', date: '[DATE]', read: '3 min read', href: 'PostCaseStudy.dc.html', excerpt: '[One-line excerpt.]' },
      { title: 'Auditing for accessibility before launch', type: 'Notes', date: '[DATE]', read: '5 min read', href: 'PostArticle.dc.html', excerpt: '[One-line excerpt.]' },
      { title: 'Joined Hounder', type: 'Notes', date: 'April 2026', read: '2 min read', href: 'PostArticle.dc.html', excerpt: '[One-line excerpt.]' },
    ];
    const current = this.state.filter;
    const filters = ['All', 'Project update', 'Notes', 'Release'].map((label) => ({
      label: label === 'All' ? 'All' : label === 'Release' ? 'Releases' : label === 'Notes' ? 'Notes' : 'Project updates',
      selected: label === current, unselected: label !== current,
      pick: () => this.setState({ filter: label }),
    }));
    const list = posts.filter((p) => current === 'All' || p.type === current);
    return { filters, featured: list[0] || posts[0], showFeatured: list.length > 0, rest: list.slice(1) };
  }
}
</script>
